<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0205" />
      <stop offset="70%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Crimson Gradient -->
    <linearGradient id="iconCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990012" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A54" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)" />
  <rect width="178" height="178" x="1" y="1" rx="41" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 7M Emblem -->
  <g transform="translate(24, 28) scale(1.2)" filter="url(#iconGlow)">
    <!-- Stylized '7' -->
    <path d="M 12 18 L 46 18 L 29 64 L 17 64 L 31 28 L 12 28 Z" fill="url(#iconCrimson)" />
    
    <!-- Stylized 'M' -->
    <path d="M 42 26 L 53 64 L 63 64 L 72 34 L 81 64 L 91 64 L 78 18 L 67 18 L 58 46 L 50 18 L 38 18 Z" fill="url(#iconCrimson)" />
  </g>
</svg>
