<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <!-- Crimson Neon Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990012" />
    </linearGradient>

    <!-- Chrome Metallic Accent Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#EDEDED" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group with Glow -->
  <g filter="url(#neonGlow)">
    <!-- Stylized '7' -->
    <path d="M 12 18 L 48 18 L 30 64 L 18 64 L 33 28 L 12 28 Z" fill="url(#crimsonGrad)" />
    
    <!-- Stylized 'M' interlocked with 7 -->
    <path d="M 44 26 L 56 64 L 66 64 L 76 34 L 86 64 L 96 64 L 82 18 L 70 18 L 61 46 L 52 18 L 39 18 Z" fill="url(#crimsonGrad)" />

    <!-- Wordmark 'EDIA' -->
    <!-- E -->
    <path d="M 112 24 L 138 24 L 138 31 L 121 31 L 121 40 L 135 40 L 135 47 L 121 47 L 121 57 L 139 57 L 139 64 L 112 64 Z" fill="url(#crimsonGrad)" />
    
    <!-- D -->
    <path d="M 148 24 L 168 24 C 180 24 188 32 188 44 C 188 56 180 64 168 64 L 148 64 Z M 157 32 L 157 56 L 167 56 C 174 56 179 51 179 44 C 179 37 174 32 167 32 Z" fill="url(#crimsonGrad)" />
    
    <!-- I -->
    <path d="M 198 24 L 207 24 L 207 64 L 198 64 Z" fill="url(#crimsonGrad)" />
    
    <!-- A -->
    <path d="M 226 24 L 240 24 L 254 64 L 244 64 L 241 55 L 225 55 L 222 64 L 212 64 Z M 233 33 L 227 48 L 239 48 Z" fill="url(#crimsonGrad)" />
  </g>
</svg>
